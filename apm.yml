name: dotnet-ts-agentic-workflow
version: 1.0.1
description: Plan / execute / review workflow - spec-driven planning, per-step test gating, ADRs, gotchas, doc-drift audits, read-only scout and critic subagents, and a protected-branch git hook.
author: Expecho
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-bot, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
- claude
- copilot
- cursor
dependencies:
  apm:
  # Semver range: `apm update` pulls the newest 4.x release tag, never untagged commits or a new major.
  - git: https://github.com/JuliusBrussee/caveman.git
    path: skills/caveman
    ref: ^4.0.0
  mcp:
  - name: microsoft-learn
    registry: false
    transport: http
    url: https://learn.microsoft.com/api/mcp
includes: auto
compilation:
  agents_md:
    # Only rewrite the block between <!-- apm:start --> and <!-- apm:end -->; leave the rest of AGENTS.md alone.
    mode: managed_section
scripts: {}
